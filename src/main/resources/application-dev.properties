# Lokal utveckling. Kör med:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
# eller med profilen dev i IntelliJ.
#
# Databasen startas av Spring Boot ur compose.yaml i projektroten (D-047). Det kräver ett
# docker-kommando på PATH; med podman räcker podman-mac-helper och Dockers CLI, se README.
# Adressen nedan används bara om compose-stödet stängs av:
#   -Dspring.docker.compose.enabled=false
# och då förutsätts en Postgres på localhost:5433 med samma uppgifter som i compose.yaml.
spring.docker.compose.enabled=true

gg.jte.development-mode=true
gg.jte.use-precompiled-templates=false

spring.datasource.url=jdbc:postgresql://localhost:5433/ministra
spring.datasource.username=ministra
spring.datasource.password=ministra

ministra.base-url=http://localhost:8080

# Ingen riktig mejlserver i utveckling. Outboxen fyller på ändå, så raderna går att titta
# på i databasen.
spring.mail.host=localhost
spring.mail.port=1025
