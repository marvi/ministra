spring.application.name=ministra

# Mallarna är förkompilerade av jte-maven-plugin och ligger i avbilden. Utvecklingsläget
# kräver källkoden på disk och får aldrig följa med till produktion (D-032).
#
# Båda raderna behövs: med development-mode=false och utan use-precompiled-templates
# vägrar jte att starta över huvud taget.
gg.jte.development-mode=false
gg.jte.use-precompiled-templates=true

# Hibernate får inte ändra schemat i produktion. Allt går via Flyway (D-033, D-045).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# All konfiguration kommer från miljövariabler ur env-filen (D-014).
spring.datasource.url=${MINISTRA_DB_URL:}
spring.datasource.username=${MINISTRA_DB_USER:}
spring.datasource.password=${MINISTRA_DB_PASSWORD:}

ministra.base-url=${MINISTRA_BASE_URL:http://localhost:8080}
ministra.mail-from=${MINISTRA_MAIL_FROM:ministra@ministra.marvi.work}
ministra.creates-per-hour-per-ip=${MINISTRA_CREATES_PER_HOUR_PER_IP:10}

# Två schemalagda jobb kan vara igång samtidigt: nattpasset och tömningen av outboxen.
# Tidszonen sätts på jobben själva, inte här (D-024).
spring.task.scheduling.pool.size=2

# Hälsokontrollen som Dockerfile och quadlet pekar på. Inget mer exponeras.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Mejlservern får inte påverka hälsan. Är den nere ska appen fortsätta gå — outboxen
# finns just för att överleva det (D-030). Med kontrollen påslagen skulle ett kort
# avbrott hos leverantören få systemd att starta om containern i onödan.
management.health.mail.enabled=false

# Loggar till stdout, aldrig till fil (D-002).
logging.file.name=
