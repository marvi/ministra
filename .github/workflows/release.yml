name: Publicera en avbild

# Taggen utlöser publiceringen. Till skillnad från lektionarium publiceras ingen
# Maven-artefakt och ingen GitHub-release — bara containeravbilden (D-032).
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # för att kunna publicera till ghcr.io

    steps:
      - uses: actions/checkout@v4

      - name: Sätt upp JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Läs versionen ur taggen
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Taggen och pom-filen måste vara överens, annars publiceras en avbild vars
      # versionsnummer inte är det taggen utlovar.
      - name: Kontrollera att taggen stämmer med pom-filen
        run: |
          pom=$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version | tail -1)
          tag=${{ steps.version.outputs.version }}
          echo "pom: $pom, tagg: $tag"
          if [ "$pom" != "$tag" ]; then
            echo "::error::Taggen v$tag pekar på en commit där pom-filen står på $pom"
            exit 1
          fi

      # Avbilden byggs sist, så den bara publiceras när testerna gått igenom.
      - name: Bygg och kör testerna
        run: ./mvnw -B --no-transfer-progress clean verify

      - name: Logga in på ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Bygg och publicera containeravbilden
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          image="ghcr.io/${{ github.repository }}"
          docker build \
            --label org.opencontainers.image.version="$VERSION" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --tag "$image:$VERSION" \
            --tag "$image:latest" \
            .
          docker push "$image:$VERSION"
          docker push "$image:latest"

      # Servern hämtar nya avbilder med podman-auto-update.timer en gång om dygnet. Det här
      # triggar det direkt över tailnetet, så att releasen är ute när flödet är grönt, och
      # kontrollerar sedan att den nya versionen svarar. Mönstret kommer från vps-deploy
      # (workflows/container-ghcr.yml).
      #
      # Kräver i repots inställningar på GitHub:
      #   secrets  TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET   Tailscale OAuth-klient med tag:ci
      #   vars     DEPLOY_HOST                           serverns namn i tailnetet
      - name: Anslut till tailnetet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Rulla ut på servern
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          SSH="ssh -o StrictHostKeyChecking=accept-new deploy@$HOST"

          # Direkt och inte via systemctl: utdatan visar om podman rullade tillbaka.
          # OBS: auto-update omfattar alla containrar på värden, inte bara ministra.
          echo "== podman auto-update =="
          OUT=$($SSH "sudo /usr/bin/podman auto-update" 2>&1 | tee /dev/stderr)
          if grep -qi 'rolled back' <<<"$OUT"; then
            echo "::error::podman rullade tillbaka – den nya avbilden startade inte."
            $SSH "journalctl -u ministra.service -n 50 --no-pager" || true
            exit 1
          fi

          if ! $SSH "systemctl is-active --quiet ministra.service"; then
            echo "::error::ministra.service är inte aktiv efter utrullningen."
            $SSH "journalctl -u ministra.service -n 50 --no-pager" || true
            exit 1
          fi

      # Uniten är aktiv så fort containern startat, innan JVM:en och Flyway är klara.
      # Hälsan genom Caddy avgör om releasen faktiskt tar emot trafik.
      - name: Vänta på att den nya versionen svarar
        env:
          URL: https://ministra.marvi.work/actuator/health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --max-time 5 "$URL" | grep -q '"UP"'; then
              echo "Frisk efter $((i * 5)) sekunder."
              exit 0
            fi
            sleep 5
          done
          echo "::error::$URL svarar inte UP efter 150 sekunder."
          exit 1
